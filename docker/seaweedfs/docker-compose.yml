services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: dtrs-seaweedfs

    command:
      - mini
      - -dir=/data

    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"

    environment:
      AWS_ACCESS_KEY_ID: dtrs-local
      AWS_SECRET_ACCESS_KEY: dtrs-local-secret
      S3_BUCKET: dtrs-documents

    volumes:
      - seaweedfs-data:/data

    restart: unless-stopped

volumes:
  seaweedfs-data:
