services:
  minio:
    image: minio/minio:latest
    container_name: dtrs-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: dtrs-admin
      MINIO_ROOT_PASSWORD: change-this-password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  minio_data:
